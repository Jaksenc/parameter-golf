name: Decision-0 arithmetic learning curve
on:
  push:
    branches: ['decision0/verified-cpu4b-20260921']
    paths: ['.github/workflows/decision0-execution-microfit-v1.yml']
permissions:
  contents: read
concurrency:
  group: decision0-execution-microfit-v1
  cancel-in-progress: false
jobs:
  fit:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 233d76fbf0f730a2a75db0d12415bc56f6ae0e0e
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify fixed study source
        run: |
          test "$(git hash-object decision0/primitive_ladder_v1/microfit.py)" = a7391219512d119774e2680269fac9a26b655fdb
          python -m py_compile decision0/primitive_ladder_v1/microfit.py
      - name: Install identical runtime
        run: |
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6' 'numpy==2.4.6' 'safetensors==0.8.0'
      - name: Fixed 32-update across-depth fit test; no benchmark evaluation
        timeout-minutes: 30
        run: python -u decision0/primitive_ladder_v1/microfit.py --out microfit-result
      - name: Preserve outcome including partial failure
        if: always()
        run: |
          mkdir -p microfit-result
          cp decision0/primitive_ladder_v1/microfit.py microfit-result/
          python -m pip freeze > microfit-result/dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mf1-result
          path: microfit-result/
          retention-days: 3
          if-no-files-found: error
