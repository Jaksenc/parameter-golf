name: Verify semantic pilot saved checkpoints v1
on:
  push:
    branches: ['research/free-decision-baselines-20260920']
    paths: ['.github/workflows/semantic-fresh-verification-v1.yml']
permissions:
  contents: read
  actions: read
jobs:
  await_source:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 33
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Await bounded source run without retriggering it
        run: |
          python -u - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/Jaksenc/parameter-golf/actions/runs/35529849663'
          for attempt in range(64):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
              print(json.dumps({'attempt':attempt,'status':data['status'],'conclusion':data['conclusion']}),flush=True)
              if data['status']=='completed':
                  if data['conclusion']!='success':raise RuntimeError('Source incomplete/failed; no substitute results')
                  break
              time.sleep(30)
          else:raise RuntimeError('Bounded wait ended; source not complete')
          PY
  verify:
    needs: await_source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 13
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    steps:
      - name: Check scope and hardware
        run: |
          test "$GITHUB_REPOSITORY" = 'Jaksenc/parameter-golf'
          grep -qw bf16 /proc/cpuinfo || exit 1
          lscpu
          free -h
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install same model runtime
        run: |
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6' 'requests==2.34.2'
      - name: Reload saved adapters and check held-out predictions
        timeout-minutes: 11
        run: python -u semantic_verify_v1.py
      - name: Preserve verifier source
        if: always()
        run: |
          mkdir -p fresh-verification
          cp semantic_verify_v1.py fresh-verification/
          python -m pip freeze > fresh-verification/dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: semantic-fresh-verification-v1
          path: |
            fresh-verification/verification.json
            fresh-verification/post-training-facts.json
            fresh-verification/original-timeout-records.json
            fresh-verification/semantic_verify_v1.py
            fresh-verification/dependencies.txt
          retention-days: 3
          if-no-files-found: error
