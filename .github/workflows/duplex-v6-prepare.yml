name: Duplex v6 source freeze and generation preflight
on:
  push:
    branches: ['research/duplex-v6-binding-budget']
    paths: ['.github/workflows/duplex-v6-prepare.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    defaults:
      run:
        working-directory: experiments/duplex-v5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate source boundary and freeze new cases
        run: |
          test "$GITHUB_REPOSITORY" = 'Jaksenc/parameter-golf'
          python binding_v6.py test
          python binding_v6.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v6-frozen-data
          path: experiments/duplex-v5/data/
          retention-days: 3
          if-no-files-found: error
  preflight:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/duplex-v5
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Owned integration question only, no benchmark inputs
        run: |
          test "$GITHUB_REPOSITORY" = 'Jaksenc/parameter-golf'
          grep -qw bf16 /proc/cpuinfo
          python -m pip install --no-cache-dir torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir transformers==5.17.0 huggingface-hub==1.32.0 sentencepiece==0.2.2 protobuf==6.33.6
          python -u binding_v6.py run --preflight
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v6-owned-preflight
          path: experiments/duplex-v5/out/preflight/
          retention-days: 3
          if-no-files-found: error
