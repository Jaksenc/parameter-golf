name: Decision-0 frontier balanced learning
on:
  push:
    branches: ['decision0/verified-cpu4b-20260921']
    paths: ['.github/workflows/decision0-frontier-balanced-v1.yml']
permissions:
  contents: read
concurrency:
  group: decision0-frontier-balanced-v1
  cancel-in-progress: false
jobs:
  learn:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        schedule: [original, blocked]
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 175d2cbcc99df1a5909256b2f582fd73adba5583
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate schedule multiset and arithmetic before model loading
        run: |
          python -m py_compile decision0/frontier_learning_v1/balanced_microfit.py
          python decision0/frontier_learning_v1/balanced_microfit.py --self-test
      - name: Install identical pinned CPU runtime
        run: |
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6' 'numpy==2.4.6' 'safetensors==0.8.0'
      - name: Exactly 36 optimizer updates and all-order fit evaluation
        timeout-minutes: 46
        run: python -u decision0/frontier_learning_v1/balanced_microfit.py --schedule '${{ matrix.schedule }}' --out result
      - name: Preserve source and runtime even after failure
        if: always()
        run: |
          mkdir -p result/source/depth_distill_v1 result/source/input_flow_v1
          cp decision0/frontier_learning_v1/balanced_microfit.py result/source/
          cp decision0/depth_distill_v1/{study.py,cases.py,snli_replay.json} result/source/depth_distill_v1/
          cp decision0/input_flow_v1/{flow_study.py,flow_data.py,prompt_variants.py,THIRD_PARTY_NOTICES.md} result/source/input_flow_v1/
          python -m pip freeze > result/dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontier-balanced-${{ matrix.schedule }}
          path: result/
          retention-days: 1
          if-no-files-found: error
