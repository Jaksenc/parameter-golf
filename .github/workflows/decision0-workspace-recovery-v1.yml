name: Decision-0 workspace transfer missing-record recovery
on:
  push:
    branches: ['decision0/verified-cpu4b-20260921']
    paths: ['.github/workflows/decision0-workspace-recovery-v1.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: decision0-workspace-recovery-v1
  cancel-in-progress: false
defaults:
  run:
    shell: bash
    working-directory: decision0/workspace_transfer_v1
env:
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  GH_TOKEN: ${{ github.token }}
jobs:
  recover:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: b999ba629b50df0ec5533df4edea9df3b4bb2197
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify unchanged experiment and recovery source
        run: |
          test "$(git hash-object transfer.py)" = 5f77873d68c64aa5cbb8d61d55ffb3256ea0a5cf
          test "$(git hash-object resume_transfer.py)" = a129c23f9fbac6025209bffc48fc9eb96857cf8d
          python transfer.py selftest
          gh run download 35913192236 -p 'wst1-shard-*' -D prior
          python -c 'import resume_transfer as r; r.initial_checks("prior"); print(len(r.prior("prior")[0]))'
      - name: Install identical pinned runtime
        run: |
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6' 'numpy==2.4.6' 'safetensors==0.8.0'
      - name: Score only missing requests with baseline replay check
        timeout-minutes: 15
        run: python -u resume_transfer.py run --prior-root prior --shard '${{ matrix.shard }}' --nshards 4 --out recovered
      - name: Retain exact source and runtime
        if: always()
        run: |
          mkdir -p recovered/source
          cp transfer.py resume_transfer.py recovered/source/
          python -m pip freeze > recovered/dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wst1-recovery-${{ matrix.shard }}
          path: decision0/workspace_transfer_v1/recovered/
          retention-days: 1
          if-no-files-found: error
  report:
    needs: recover
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: b999ba629b50df0ec5533df4edea9df3b4bb2197
      - name: Join original and recovered records with exact coverage
        run: |
          gh run download 35913192236 -p 'wst1-shard-*' -D prior
          gh run download "$GITHUB_RUN_ID" -p 'wst1-recovery-*' -D recovery
          python3 resume_transfer.py combine --prior-root prior --recovery-root recovery --out joined
          python3 transfer.py aggregate --phase dev --root joined --out final
          cp transfer.py resume_transfer.py final/
          cp -R prior recovery joined final/
          cp -R ../input_flow_v1 final/parent_source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wst1-recovered-final
          path: decision0/workspace_transfer_v1/final/
          retention-days: 3
          if-no-files-found: error
