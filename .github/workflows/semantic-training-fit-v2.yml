name: Measure saved semantic checkpoint training fit v2
on:
  push:
    branches: ['research/free-decision-baselines-20260920']
    paths: ['.github/workflows/semantic-training-fit-v2.yml']
permissions:
  contents: read
  actions: read
jobs:
  fit:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 9
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        arm: [baseline, direct, auxiliary]
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - name: Check scope and BF16
        run: |
          test "$GITHUB_REPOSITORY" = 'Jaksenc/parameter-golf'
          grep -qw bf16 /proc/cpuinfo || exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install identical runtime
        run: |
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6' 'requests==2.34.2'
      - name: Evaluate all original training cases, without training
        timeout-minutes: 7
        run: python -u semantic_training_fit_v2.py --arm '${{ matrix.arm }}'
      - name: Preserve fit diagnostic source
        if: always()
        run: |
          mkdir -p 'fit-${{ matrix.arm }}'
          cp semantic_training_fit_v2.py 'fit-${{ matrix.arm }}/'
          python -m pip freeze > 'fit-${{ matrix.arm }}/dependencies.txt'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: semantic-training-fit-${{ matrix.arm }}-v2
          path: |
            fit-${{ matrix.arm }}/fit.json
            fit-${{ matrix.arm }}/records.jsonl
            fit-${{ matrix.arm }}/semantic_training_fit_v2.py
            fit-${{ matrix.arm }}/dependencies.txt
          retention-days: 3
          if-no-files-found: error
