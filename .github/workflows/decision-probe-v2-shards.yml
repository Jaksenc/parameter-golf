name: Qwen decision probe v2 shards
on:
  push:
    branches: ['research/free-decision-baselines-20260920']
    paths: ['decision_probe_v2_shard.py', '.github/workflows/decision-probe-v2-shards.yml']
permissions:
  contents: read
jobs:
  shard:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        index: [0, 1, 2, 3]
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
      PROBE_SHARD_INDEX: ${{ matrix.index }}
    steps:
      - name: Require native BF16 before downloads
        run: |
          lscpu
          grep -qw avx512_bf16 /proc/cpuinfo || { echo 'Unsupported BF16 CPU allocation; no weights downloaded or examples scored.'; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install unchanged native CPU runtime
        run: |
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'datasets==4.8.5' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6'
      - name: Score deterministic one-quarter partition
        run: python -u decision_probe_v2_shard.py
      - name: Runtime receipt
        if: always()
        run: |
          python -m pip freeze
          echo 'Standard public CPU runner, no paid API, no artifacts/cache, no training.'
