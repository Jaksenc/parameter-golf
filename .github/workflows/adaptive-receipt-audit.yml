name: Adaptive benchmark receipt audit
on:
  push:
    branches: [research/adaptive-external-benchmarks-20260920]
    paths: [.github/workflows/adaptive-receipt-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait only for existing bounded run receipts, then verify
        run: |
          python3 -u - <<'PY'
          import json,time,urllib.request
          url='https://api.github.com/repos/Jaksenc/parameter-golf/contents/research/adaptive_external/results?ref=research%2Fadaptive-external-benchmarks-20260920'
          deadline=time.monotonic()+360
          while True:
              req=urllib.request.Request(url,headers={'User-Agent':'adaptive-readonly-receipts'})
              rows=json.loads(urllib.request.urlopen(req,timeout=30).read())
              names={r['name'] for r in rows}
              count=sum(f'bbeh-shard-{i:02d}.json' in names for i in range(6))
              print(f'Existing completed receipts: {count}/6',flush=True)
              if count==6 or time.monotonic()>=deadline:break
              time.sleep(20)
          PY
          python3 -u research/adaptive_external/collect_results.py
