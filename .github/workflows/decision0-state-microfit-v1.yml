name: Decision-0 verified numerical-state learning
on:
  push:
    branches: ['decision0/verified-cpu4b-20260921']
    paths: ['.github/workflows/decision0-state-microfit-v1.yml']
permissions:
  contents: read
concurrency:
  group: decision0-state-microfit-v1
  cancel-in-progress: false
jobs:
  train:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [repeat_total, process]
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: f8c01e3e8e7f490e2364cc7f9cbeb9f446656ea6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate data and pinned reused runtime before inference
        run: |
          test "$(git hash-object decision0/depth_distill_v1/study.py)" = d1080ab704a5892d11027b76a4823eeb52646bed
          test "$(git hash-object decision0/input_flow_v1/flow_study.py)" = 35d9e8a127b86f43040d11b6d5bd14c679ebe143
          python -m py_compile decision0/frontier_states_v1/state_microfit.py
          python decision0/frontier_states_v1/state_microfit.py --arm '${{ matrix.arm }}' --out unused --check-only
      - name: Install identical previously verified CPU runtime
        run: |
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6' 'numpy==2.4.6' 'safetensors==0.8.0'
      - name: Train fixed matched curriculum and test free-running generation
        timeout-minutes: 40
        run: python -u decision0/frontier_states_v1/state_microfit.py --arm '${{ matrix.arm }}' --out state-result
      - name: Prepare bounded research artifact
        if: always()
        run: |
          mkdir -p export/source
          cp decision0/frontier_states_v1/state_microfit.py export/source/
          cp state-result/*.json export/ || true
          if [ -f state-result/adapter.safetensors ]; then cp state-result/adapter.safetensors export/; elif [ -f state-result/recovery.safetensors ]; then cp state-result/recovery.safetensors export/; fi
          python -m pip freeze > export/dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: state-learning-${{ matrix.arm }}
          path: export/
          retention-days: 1
          if-no-files-found: error
