name: Decision-0 numerical state stress test
on:
  push:
    branches: ['decision0/verified-cpu4b-20260921']
    paths: ['.github/workflows/decision0-state-stress-v1.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: decision0-state-stress-v1
  cancel-in-progress: false
env:
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  GH_TOKEN: ${{ github.token }}
jobs:
  evaluate:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 6dc5fd9c5aab0d8d7342ce76891bb11c2e7c2acd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify pinned source and exact reference cases
        run: |
          test "$(git hash-object decision0/state_stress_v1/state_stress.py)" = aad436116d6c0296d63a6ae3b25503bd57307039
          test "$(git hash-object decision0/depth_distill_v1/study.py)" = d1080ab704a5892d11027b76a4823eeb52646bed
          test "$(git hash-object decision0/input_flow_v1/flow_study.py)" = 35d9e8a127b86f43040d11b6d5bd14c679ebe143
          python decision0/state_stress_v1/state_stress.py selftest
      - name: Install previously tested pinned CPU runtime
        run: |
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6' 'numpy==2.4.6' 'safetensors==0.8.0'
      - name: Retrieve only the two fixed completed numerical checkpoints
        run: gh run download 35795105921 -p 'state-learning-*' -D checkpoints
      - name: Run six fixed conditions on new sources without weight updates
        timeout-minutes: 25
        run: python -u decision0/state_stress_v1/state_stress.py run --shard '${{ matrix.shard }}' --checkpoints checkpoints --out stress-result
      - name: Preserve source and dependencies
        if: always()
        run: |
          mkdir -p stress-result/source
          cp decision0/state_stress_v1/state_stress.py stress-result/source/
          python -m pip freeze > stress-result/dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: state-stress-${{ matrix.shard }}
          path: stress-result/
          retention-days: 1
          if-no-files-found: error
  report:
    needs: evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 6dc5fd9c5aab0d8d7342ce76891bb11c2e7c2acd
      - name: Require all fixed conditions and complete coverage
        run: |
          gh run download "$GITHUB_RUN_ID" -p 'state-stress-*' -D shards
          python3 decision0/state_stress_v1/state_stress.py aggregate --root shards --out final
          cp decision0/state_stress_v1/state_stress.py final/
          cp -r shards final/shards
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: state-stress-final
          path: final/
          retention-days: 3
          if-no-files-found: error
