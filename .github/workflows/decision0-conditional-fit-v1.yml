name: Decision-0 conditional training-fit diagnostic
on:
  push:
    branches: ['decision0/verified-cpu4b-20260921']
    paths: ['.github/workflows/decision0-conditional-fit-v1.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: decision0-conditional-fit-v1
  cancel-in-progress: false
defaults:
  run:
    shell: bash
    working-directory: decision0/conditional_assignment_v1
env:
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  GH_TOKEN: ${{ github.token }}
jobs:
  fit:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 8d862fdca03e7bcaa31e540f9b7cc549d60837e4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify the unchanged trained experiment and read-only diagnostic
        run: |
          git -C "$GITHUB_WORKSPACE" apply "$GITHUB_WORKSPACE/decision0/depth_distill_v1/revision2.patch"
          test "$(git hash-object ../depth_distill_v1/study.py)" = 8c2dd2bd4da074ab4a2340ba7829c3184332dbee
          test "$(git hash-object triplet_study.py)" = 77607c602ac6c672056ad811605b751a9a3216e8
          test "$(git hash-object fit_diagnostic.py)" = 9e2125a7efbdcfab48376dfb9e06007aa4a1113b
          python -m py_compile fit_diagnostic.py
      - name: Install identical model runtime
        run: |
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6' 'numpy==2.4.6' 'safetensors==0.8.0'
      - name: Read the two already-completed final checkpoints
        run: gh run download 35737667113 -p 'ca1-trained-*' -D checkpoints
      - name: Score seen training cases without updates or checkpoint selection
        run: python -u fit_diagnostic.py --checkpoint-root checkpoints --shard '${{ matrix.shard }}' --out fit-result
      - name: Preserve read-only source
        if: always()
        run: |
          mkdir -p fit-result
          cp fit_diagnostic.py fit-result/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ca1-fit-${{ matrix.shard }}
          path: decision0/conditional_assignment_v1/fit-result/
          retention-days: 1
          if-no-files-found: error
