name: Free public decision baselines
on:
  push:
    branches: ['research/free-decision-baselines-20260920']
    paths: ['benchmark.py', '.github/workflows/free-decision-baselines.yml']
permissions:
  contents: read
concurrency:
  group: free-decision-baselines-20260920
  cancel-in-progress: false
jobs:
  baseline:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [gliclass, qwen]
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify free-runner scope and hardware
        run: |
          test "$GITHUB_REPOSITORY" = 'Jaksenc/parameter-golf'
          echo 'Standard runner in public repository. No paid APIs, caches, or artifact uploads.'
          lscpu
          free -h
          df -h .
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers>=5.2,<6' 'datasets>=4,<5' sentencepiece 'protobuf<7'
          if [ '${{ matrix.model }}' = 'gliclass' ]; then
            python -m pip install --no-cache-dir 'git+https://github.com/Knowledgator/GLiClass@40baa67cdea577449bc3f6a251646377b2cb0a6c'
          fi
      - name: Execute actual pretrained baseline
        run: python -u benchmark.py --model '${{ matrix.model }}' --real-per-family 16
      - name: Dependency and storage receipt
        if: always()
        run: |
          python -m pip freeze
          df -h .
          echo 'No Actions artifacts or caches uploaded; results retained in job logs.'
