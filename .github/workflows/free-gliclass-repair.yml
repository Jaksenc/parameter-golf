name: Free GLiClass baseline repair
on:
  push:
    branches: ['research/free-decision-baselines-20260920']
    paths: ['.github/workflows/free-gliclass-repair.yml']
permissions:
  contents: read
concurrency:
  group: free-gliclass-repair-20260920
  cancel-in-progress: false
jobs:
  baseline:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --no-cache-dir torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir transformers==5.17.0 datasets==4.8.5 huggingface_hub==1.32.0 sentencepiece==0.2.2 'protobuf<7'
          python -m pip install --no-cache-dir 'git+https://github.com/Knowledgator/GLiClass@40baa67cdea577449bc3f6a251646377b2cb0a6c'
      - name: Apply audited one-line wrapper fix
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          path=Path('benchmark.py')
          old=path.read_text()
          needle='text=pipeline.prepare_input('
          assert old.count(needle)==1
          new=old.replace(needle,'text=pipeline.pipe.prepare_input(')
          path.write_text(new)
          print(json.dumps({'kind':'source_patch','before_sha256':hashlib.sha256(old.encode()).hexdigest(),'after_sha256':hashlib.sha256(new.encode()).hexdigest(),'replacement':'pipeline.prepare_input -> pipeline.pipe.prepare_input','model_weights_changed':False,'test_inputs_changed':False}))
          compile(new,str(path),'exec')
          PY
      - name: Execute actual GLiClass baseline
        run: python -u benchmark.py --model gliclass --real-per-family 16
      - name: Runtime receipt
        if: always()
        run: |
          python -m pip freeze
          free -h
          echo 'Standard public CPU only. No paid API, cache upload, artifact upload, or training.'
