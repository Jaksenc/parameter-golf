name: Public decision probe v2
on:
  push:
    branches: ['research/free-decision-baselines-20260920']
    paths: ['decision_probe_v2.py', '.github/workflows/decision-probe-v2.yml']
permissions:
  contents: read
concurrency:
  group: decision-probe-v2
  cancel-in-progress: false
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        model: [gliclass-instruct, qwen-4b, qwen-08b]
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify scope and test controlled data
        run: |
          test "$GITHUB_REPOSITORY" = 'Jaksenc/parameter-golf'
          echo 'Standard public CPU runner; no paid APIs, private files, artifact uploads or caches.'
          lscpu
          free -h
          python decision_probe_v2.py --self-test
      - name: Install pinned CPU model runtime
        run: |
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'datasets==4.8.5' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6'
          if [ '${{ matrix.model }}' = 'gliclass-instruct' ]; then
            python -m pip install --no-cache-dir 'git+https://github.com/Knowledgator/GLiClass@40baa67cdea577449bc3f6a251646377b2cb0a6c'
          fi
      - name: Execute fixed 400-case component probe
        run: python -u decision_probe_v2.py --model '${{ matrix.model }}'
      - name: Dependency receipt
        if: always()
        run: |
          python -m pip freeze
          df -h .
          echo 'No model training, API inference charges, Actions artifacts or cache uploads.'
