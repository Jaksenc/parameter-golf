name: Learn v16 - common checkpoint evaluation
on:
  push:
    branches: ['research/learn-v16-20260922']
    paths: ['.github/workflows/learn-v16-checkpoint-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 24
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        seed: [16101, 16102, 16103]
        arm: [supervised, relational]
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 35808253851
          name: learn-v16-evidence
      - name: Validate code and install the pinned inference runtime
        run: |
          test "$GITHUB_REPOSITORY" = 'Jaksenc/parameter-golf'
          grep -qw bf16 /proc/cpuinfo
          python -m py_compile evaluate_learn_v16_saved.py
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6' 'numpy==2.2.6' 'safetensors==0.8.0'
      - name: Evaluate the availability-defined checkpoint on all original evaluation inputs
        run: python -u evaluate_learn_v16_saved.py --seed '${{ matrix.seed }}' --arm '${{ matrix.arm }}' --out 'evaluation-${{ matrix.seed }}-${{ matrix.arm }}'
      - name: Preserve dependencies
        if: always()
        run: |
          mkdir -p 'evaluation-${{ matrix.seed }}-${{ matrix.arm }}'
          python -m pip freeze > 'evaluation-${{ matrix.seed }}-${{ matrix.arm }}/dependencies.txt'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: learn-v16-evaluation-${{ matrix.seed }}-${{ matrix.arm }}
          path: evaluation-${{ matrix.seed }}-${{ matrix.arm }}/
          retention-days: 14
          if-no-files-found: error
  aggregate:
    needs: evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: learn-v16-evaluation-*
          path: checkpoint-evaluation
      - name: Require all paired checkpoints and complete 72-item records
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          result=[]
          for seed in [16101,16102,16103]:
              for arm in ['supervised','relational']:
                  d=Path('checkpoint-evaluation')/f'learn-v16-evaluation-{seed}-{arm}'
                  c=json.load(open(d/'complete.json'));p=d/'predictions.jsonl'
                  assert c['outputs']==72 and c['evaluated_step']==32 and c['new_optimizer_updates']==0
                  assert c['records_sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
                  rows=[json.loads(s) for s in p.read_text().splitlines()]
                  assert len(rows)==72 and len({r['id'] for r in rows})==72
                  result.append({'seed':seed,'arm':arm,'outputs':72,'checkpoint':c['checkpoint_sha256']})
          Path('checkpoint-completion.json').write_text(json.dumps({'status':'common-step32-evaluation-complete','planned64_status':'incomplete','models':result,'new_outputs':432},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learn-v16-checkpoint-audit-complete
          path: |
            checkpoint-evaluation/
            checkpoint-completion.json
            evaluate_learn_v16_saved.py
            LEARN_V16_RECOVERY_PROTOCOL.md
          retention-days: 14
          if-no-files-found: error
