name: Adaptive native format control
on:
  push:
    branches: [research/adaptive-replay-v09-20260921]
    paths: [.github/workflows/adaptive-replay-native.yml]
permissions:
  contents: read
jobs:
  preflight:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: probe
        run: python3 -u research/adaptive_replay/native_followup.py --preflight
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: replay-native-preflight
          path: |
            native-preflight.json
            native-source.zip
          retention-days: 1
          if-no-files-found: warn
  benchmark:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -u research/adaptive_replay/native_followup.py --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: replay-native-${{ matrix.shard }}
          path: native-shard-*.json
          retention-days: 1
          if-no-files-found: warn
