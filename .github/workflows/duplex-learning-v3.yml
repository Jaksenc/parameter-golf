name: Duplex exact terminal learning v3
on:
  push:
    branches: ['research/free-decision-baselines-20260920']
    paths: ['.github/workflows/duplex-learning-v3.yml']
permissions:
  contents: read
jobs:
  learn:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    steps:
      - name: Require authorized public scope and native BF16
        run: |
          test "$GITHUB_REPOSITORY" = 'Jaksenc/parameter-golf'
          grep -qw bf16 /proc/cpuinfo || exit 1
          lscpu
          free -h
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install same pinned runtime and check code/data
        run: |
          python -m py_compile duplex_learning_v3.py
          python semantic_data_v1.py
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6'
      - name: Verify cached computation, fit, save and replay actual model
        timeout-minutes: 22
        run: python -u duplex_learning_v3.py
      - name: Preserve reproducibility receipt even on failure
        if: always()
        run: |
          mkdir -p learning-v3
          cp duplex_learning_v3.py semantic_train_v1.py semantic_data_v1.py learning-v3/
          python -m pip freeze > learning-v3/dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: duplex-terminal-learning-v3
          path: learning-v3/
          retention-days: 3
          if-no-files-found: error
