name: Complete saved semantic adapter evaluation v2
on:
  push:
    branches: ['research/free-decision-baselines-20260920']
    paths: ['.github/workflows/semantic-saved-eval-v2.yml']
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 17
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [direct, auxiliary]
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    steps:
      - name: Verify public scope and native BF16
        run: |
          test "$GITHUB_REPOSITORY" = 'Jaksenc/parameter-golf'
          grep -qw bf16 /proc/cpuinfo || exit 1
          lscpu
          free -h
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install unchanged model runtime
        run: |
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6' 'requests==2.34.2'
      - name: Evaluate saved final checkpoint without any training
        timeout-minutes: 14
        run: python -u semantic_saved_eval_v2.py --arm '${{ matrix.arm }}'
      - name: Preserve runtime and source receipt
        if: always()
        run: |
          mkdir -p 'evaluation-${{ matrix.arm }}'
          cp semantic_saved_eval_v2.py 'evaluation-${{ matrix.arm }}/'
          python -m pip freeze > 'evaluation-${{ matrix.arm }}/recovery-dependencies.txt'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: semantic-complete-${{ matrix.arm }}-v2
          path: evaluation-${{ matrix.arm }}/
          retention-days: 3
          if-no-files-found: error
