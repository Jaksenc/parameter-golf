name: Adaptive language independent audit
on:
  push:
    branches: [research/adaptive-language-v07-20260921]
    paths: [.github/workflows/adaptive-language-audit.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Read bounded existing completion receipts
        run: |
          python3 -u - <<'PY'
          import json,time,urllib.request
          expected={f'language-shard-{i:02d}.json' for i in range(12)}|{f'grounding-shard-{i:02d}.json' for i in range(4)}
          deadline=time.monotonic()+720
          while True:
              url='https://api.github.com/repos/Jaksenc/parameter-golf/contents/research/adaptive_language/results?ref=research%2Fadaptive-language-v07-20260921'
              req=urllib.request.Request(url,headers={'User-Agent':'adaptive-receipt-audit'})
              items=json.loads(urllib.request.urlopen(req,timeout=30).read())
              found={x['name'] for x in items}
              print('Existing receipts:',len(expected&found),'of',len(expected),flush=True)
              if expected<=found:break
              if time.monotonic()>=deadline:raise TimeoutError('Existing jobs have not all published; no incomplete score fabricated')
              time.sleep(20)
          PY
      - name: Replay independent computations and publish aggregate receipts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -u research/adaptive_language/collect_audit.py
