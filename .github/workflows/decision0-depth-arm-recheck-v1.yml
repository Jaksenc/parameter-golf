name: Decision-0 ARM across-depth recheck
on:
  push:
    branches: ['decision0/verified-cpu4b-20260921']
    paths: ['.github/workflows/decision0-depth-arm-recheck-v1.yml']
permissions:
  contents: read
concurrency:
  group: decision0-depth-arm-recheck-v1
  cancel-in-progress: false
jobs:
  preflight:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 4a6490b5247e447d9e3dc3ccab8d9892422f7a7a
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Require native ARM BF16 and instrument the identical one-example update
        run: |
          test "$GITHUB_REPOSITORY" = 'Jaksenc/parameter-golf'
          test "$(uname -m)" = aarch64
          grep -qw bf16 /proc/cpuinfo
          python - <<'PY'
          from pathlib import Path
          p=Path('decision0/depth_preflight_v1.py')
          s=p.read_text()
          old="    loss.backward();backward_seconds=time.perf_counter()-tick"
          new="    print('Starting real backward pass across all 32 layers',flush=True)\n    loss.backward();backward_seconds=time.perf_counter()-tick\n    print('Backward pass completed',flush=True)"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="    with torch.inference_mode():after=score().clone()\n    for h in hooks:h.remove()"
          new="""    with torch.inference_mode():after=score().clone()
              checkpoint=out/'single_example_roundtrip.pt'
              torch.save({k:v.detach().cpu().clone() for k,v in factors.state_dict().items()},checkpoint)
              saved_hash=digest_file(checkpoint)
              with torch.no_grad():
                  for factor in factors: factor.b.zero_()
              factors.load_state_dict(torch.load(checkpoint,map_location='cpu',weights_only=True))
              with torch.inference_mode():reloaded=score().clone()
              reload_error=float((reloaded-after).abs().max())
              if reload_error>1e-4:raise RuntimeError(f'Checkpoint round-trip failed: {reload_error}')
              save(out/'checkpoint_roundtrip.json',{'sha256':saved_hash,'maximum_logit_difference':reload_error,'scope':'same-process factor reset and file reload, not a fresh base-model reload','ephemeral_checkpoint_removed':True})
              checkpoint.unlink()
              for h in hooks:h.remove()"""
          assert s.count(old)==1
          s=s.replace(old,new)
          Path('decision0/depth_preflight_arm_recheck.py').write_text(s)
          PY
          python -m py_compile decision0/depth_preflight_arm_recheck.py
      - name: Install identical pinned CPU model runtime
        run: |
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6' 'numpy==2.4.6' 'safetensors==0.8.0'
      - name: Verify one real all-depth update, reload, and base restoration
        timeout-minutes: 14
        run: python -u decision0/depth_preflight_arm_recheck.py --out depth-arm-result
      - name: Preserve only diagnostics and source
        if: always()
        run: |
          mkdir -p depth-arm-result
          cp decision0/depth_preflight_arm_recheck.py depth-arm-result/ || true
          rm -f depth-arm-result/single_example_roundtrip.pt
          python -m pip freeze > depth-arm-result/dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: decision0-depth-arm-recheck-result
          path: depth-arm-result/
          retention-days: 1
          if-no-files-found: error
