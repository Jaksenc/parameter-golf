name: Qwen decision probe v2 ARM
on:
  push:
    branches: ['research/free-decision-baselines-20260920']
    paths: ['.github/workflows/decision-probe-v2-arm.yml']
permissions:
  contents: read
jobs:
  shard:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        index: [0, 1, 2, 3]
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
      PROBE_SHARD_INDEX: ${{ matrix.index }}
    steps:
      - name: Require native ARM BF16 before downloads
        run: |
          lscpu
          grep -qw bf16 /proc/cpuinfo || { echo 'No native ARM BF16; stopped before model downloads.'; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install unchanged model runtime
        run: |
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'datasets==4.8.5' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6'
      - name: Native BF16 arithmetic preflight
        run: |
          python - <<'PY'
          import torch,time
          torch.set_num_threads(4)
          a=torch.randn(160,2560,dtype=torch.bfloat16); b=torch.randn(2560,8192,dtype=torch.bfloat16)
          a@b
          t=time.perf_counter()
          for i in range(10): a@b
          dt=(time.perf_counter()-t)/10
          print('BF16 GEMM seconds',dt,flush=True)
          assert dt < 0.1, 'CPU runtime too slow for bounded model run; stopped before weights.'
          PY
      - name: Score deterministic one-quarter partition
        run: python -u decision_probe_v2_shard.py
      - name: Runtime receipt
        if: always()
        run: |
          python -m pip freeze
          echo 'Standard public ARM runner; no paid APIs, artifacts, cache or training.'
