name: Decision-0 verified CPU 4B study v2
on:
  push:
    branches: ['decision0/verified-cpu4b-20260921']
    paths: ['.github/workflows/decision0-cpu4b-verified-v2.yml']
permissions:
  contents: read
  actions: read
jobs:
  study:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6' 'safetensors>=0.5.2,<1'
      - name: Validate patched runner
        run: python -m py_compile decision0/cpu4b_verified.py
      - name: Run fresh 4B cache, matched training, and 231-case public evaluation
        timeout-minutes: 210
        run: python -u decision0/cpu4b_verified.py --out result
      - name: Preserve environment and source
        if: always()
        run: |
          mkdir -p result
          python -m pip freeze > result/dependencies.txt || true
          cp decision0/cpu4b_verified.py result/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: decision0-verified-cpu4b-result-v2
          path: result/
          retention-days: 3
          if-no-files-found: error
