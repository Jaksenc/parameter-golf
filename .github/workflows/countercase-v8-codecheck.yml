name: Countercase v8 - independent code and source replay
on:
  push:
    branches: ['research/countercase-v8-20260921']
    paths: ['.github/workflows/countercase-v8-codecheck.yml']
permissions:
  contents: read
  actions: read
jobs:
  validate:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 35665066216
          name: countercase-v8-prepared
          path: data
      - name: Check locked sources, all tests, and independent input selection
        run: |
          test "$GITHUB_REPOSITORY" = 'Jaksenc/parameter-golf'
          python -m pip install --no-cache-dir 'numpy==2.3.5'
          python -u - <<'PY'
          import datetime,hashlib,json,re,subprocess,sys
          from pathlib import Path
          import numpy
          import analyze_v8
          lock=json.loads(Path('COUNTERCASE_V8_ANALYSIS_LOCK.json').read_text())
          for name,expected in lock['files'].items():
              actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual==expected,(name,actual,expected)
          test=subprocess.run([sys.executable,'-m','unittest','-v','test_countercase','test_analysis'],capture_output=True,text=True)
          print(test.stdout+test.stderr)
          assert test.returncode==0
          assert re.search(r'Ran 45 tests',test.stderr)
          root=Path('data')
          manifest=json.loads((root/'countercase-prepared/manifest.json').read_text())
          evaluation=json.loads((root/'countercase-prepared/evaluation.json').read_text())
          source_audit=analyze_v8.source_selection(root,evaluation,manifest)
          Path('codecheck.json').write_text(json.dumps({'passed':True,'tests':45,'source_hashes_verified':lock['files'],
              'source_audit':source_audit,'python':sys.version,'numpy':numpy.__version__,
              'executed_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'new_model_calls':0,'model_performance_evaluated':False},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: countercase-v8-codecheck
          path: codecheck.json
          retention-days: 14
          if-no-files-found: error
