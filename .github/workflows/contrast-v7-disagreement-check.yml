name: Contrast v7 - live disagreement branch replay
on:
  push:
    branches: ['research/contrast-v7-20260921']
    paths: ['.github/workflows/contrast-v7-disagreement-check.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 35651891496
          name: contrast-v7-prepared
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 35651891496
          name: contrast-v7-shard-1
          path: reference-fixture
      - name: Install unchanged CPU runtime
        run: |
          test "$GITHUB_REPOSITORY" = 'Jaksenc/parameter-golf'
          echo '52771fdb5d8c7e5315c6f49ac87b725ba1244c0fe5ba4f5a0674ec4de3778d0b  contrast_v7.py' | sha256sum -c -
          echo 'd234f421f9477bc3f9579659443c924fe21cf1190ac9c5189d88e9a66b82caf8  decide_contrast.py' | sha256sum -c -
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6'
      - name: Replay first recorded disagreement, selected for branch coverage only
        run: |
          python -u - <<'PY'
          import json
          from pathlib import Path
          import contrast_v7 as c
          from decide_contrast import decide
          from reconstruct_v1 import Runtime
          refs=[json.loads(x) for x in Path('reference-fixture/records.jsonl').read_text().splitlines()]
          chosen=next(r for r in refs if r['disagreed'])
          jobs=json.load(open('contrast-prepared/jobs.json'))
          payload=next(t['input'] for group in jobs for t in group if t['input']['id']==chosen['id'])
          rt=Runtime(Path('reconstruction-inputs'))
          result=decide(rt,payload)
          assert result['disagreed'] and result['answer']==chosen['predictions']['contrast_consensus']
          assert result['trace_sha256']==c.h5.digest({'base':chosen['base_prefix']['text'],'checker':chosen['checker_trace']['text']})
          for key in ('0','1'):
              assert result['judgments'][key]['label']==chosen['judgments'][key]['label']
          c.h5.write('live-primary-check.json',{'results':[result],'selection':'First recorded disagreement in shard 1, selected post-outcome for control-flow coverage only; not selected for correctness, not a performance benchmark, no policy or prompt change.','source_sha256':c.h5.filehash('contrast_v7.py'),'entry_sha256':c.h5.filehash('decide_contrast.py')})
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: contrast-v7-live-disagreement
          path: live-primary-check.json
          retention-days: 14
          if-no-files-found: error
