name: Audit public decision probe v2
on:
  push:
    branches: ['research/free-decision-baselines-20260920']
    paths: ['audit_probe_v2.py', '.github/workflows/decision-probe-v2-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Wait for the bounded inference run
        run: |
          python - <<'PY'
          import time
          from audit_probe_v2 import api
          for i in range(60):
              run=api('/actions/runs/35518735165')
              if run['status']=='completed':
                  if run['conclusion']!='success':
                      raise RuntimeError('Model run did not succeed; do not report a complete comparison')
                  break
              time.sleep(10)
          else:
              raise RuntimeError('Inference not complete; audit stopped without a result')
          PY
      - name: Install data readers only
        run: python -m pip install --no-cache-dir 'datasets==4.8.5' 'huggingface-hub==1.32.0'
      - name: Verify and fit declared comparisons
        run: python -u audit_probe_v2.py --run 35518735165
