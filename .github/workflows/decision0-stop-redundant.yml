name: Stop redundant Decision-0 runs
on:
  push:
    branches: ['decision0/verified-cpu4b-20260921']
    paths: ['.github/workflows/decision0-stop-redundant.yml']
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel only redundant monolithic runs on the isolated study branch
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = 'Jaksenc/parameter-golf'
          python3 - <<'PY'
          import json, subprocess, os
          repo='Jaksenc/parameter-golf'
          branch='decision0/verified-cpu4b-20260921'
          workflows={363650311,363652988}
          raw=subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs?branch=decision0%2Fverified-cpu4b-20260921&per_page=100'])
          runs=json.loads(raw)['workflow_runs']
          for r in runs:
              if r['head_branch']==branch and r['workflow_id'] in workflows and r['status'] in ('queued','in_progress','waiting','pending'):
                  rid=int(r['id'])
                  p=subprocess.run(['gh','api','-X','POST',f'repos/{repo}/actions/runs/{rid}/cancel'],capture_output=True,text=True)
                  print(json.dumps({'cancel_requested':rid,'returncode':p.returncode,'response':p.stdout,'error':p.stderr}))
                  if p.returncode and '409' not in p.stderr:raise RuntimeError('Cancellation failed')
          print('Cleanup scoped to the two monolithic workflows; cached feature shards retained.')
          PY
