name: Learn v16 - paired direct probability training
on:
  push:
    branches: ['research/learn-v16-20260922']
    paths: ['.github/workflows/learn-v16.yml']
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 35802731023
          name: bridge-v15-complete
      - name: Check scientific inputs and gradient replay
        run: |
          test "$GITHUB_REPOSITORY" = 'Jaksenc/parameter-golf'
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m unittest -v test_learn_v16 2>&1 | tee learn-preflight.txt
          test ${PIPESTATUS[0]} -eq 0
          python -u learn_data.py
          python - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          m=json.load(open('learn-prepared/manifest.json'))
          assert m['records_sha256']=='069c87039a67b933922ef9dafcd2fc8fd47b2fe675114b55d6d9d7eb171ecf14'
          assert m['relations_sha256']=='9d29f2a0a47d27ee4c291a7a1e35cb6475532e816992774cf62a51520c43a639'
          names=['learn_v16.py','learn_data.py','relational_objective.py','test_learn_v16.py','measure_v14.py','bridge_v15.py','contrast_v7.py','reconstruct_v1.py','handoff_v5.py','evidence_v4.py','jevbench_public_v1.py']
          freeze={'source_commit':os.environ['GITHUB_SHA'],'sources':{n:hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in names},'dataset':m,'seeds':[16101,16102,16103],'arms':['supervised','relational'],'steps':64,'no_outcomes_inspected':True}
          Path('learn-prepared/freeze.json').write_text(json.dumps(freeze,sort_keys=True,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: learn-v16-prepared
          path: |
            learn_v16.py
            learn_data.py
            relational_objective.py
            test_learn_v16.py
            LEARN_V16_PROTOCOL.md
            learn-preflight.txt
            learn-prepared/
            bridge_v15.py
            measure_v14.py
            contrast_v7.py
            handoff_v5.py
            reconstruct_v1.py
            evidence_v4.py
            jevbench_public_v1.py
            reconstruction-inputs/benchmark/vendor/
          retention-days: 14
          if-no-files-found: error
  train:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        seed: [16101,16102,16103]
        arm: ['supervised','relational']
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: learn-v16-prepared
      - name: Validate frozen code and pinned CPU runtime
        run: |
          test "$GITHUB_REPOSITORY" = 'Jaksenc/parameter-golf'
          grep -qw bf16 /proc/cpuinfo
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          f=json.load(open('learn-prepared/freeze.json'))
          for n,h in f['sources'].items():assert hashlib.sha256(Path(n).read_bytes()).hexdigest()==h
          PY
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6'
      - name: Train fixed objective and evaluate fixed final checkpoint
        run: python -u learn_v16.py --seed '${{ matrix.seed }}' --arm '${{ matrix.arm }}' --out 'model-${{ matrix.seed }}-${{ matrix.arm }}'
      - name: Preserve runtime dependencies
        if: always()
        run: |
          mkdir -p 'model-${{ matrix.seed }}-${{ matrix.arm }}'
          python -m pip freeze > 'model-${{ matrix.seed }}-${{ matrix.arm }}/dependencies.txt'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: learn-v16-model-${{ matrix.seed }}-${{ matrix.arm }}
          path: model-${{ matrix.seed }}-${{ matrix.arm }}/
          retention-days: 14
          if-no-files-found: error
  aggregate:
    if: always()
    needs: [prepare,train]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: learn-v16-prepared
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: learn-v16-model-*
          path: trained
      - name: Record completion without hiding failed runs
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          complete=[];missing=[]
          for seed in (16101,16102,16103):
              for arm in ('supervised','relational'):
                  p=Path('trained')/f'learn-v16-model-{seed}-{arm}'
                  if not (p/'complete.json').exists():missing.append({'seed':seed,'arm':arm});continue
                  x=json.load(open(p/'complete.json'))
                  assert x['seed']==seed and x['arm']==arm and x['steps']==64 and x['updated_layers']==32
                  assert hashlib.sha256((p/'adapter.safetensors').read_bytes()).hexdigest()==x['checkpoint_sha256']
                  complete.append(x)
          Path('completion.json').write_text(json.dumps({'status':'complete' if not missing else 'partial','models':complete,'missing':missing},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: learn-v16-evidence
          path: |
            completion.json
            trained/
            learn-prepared/
            learn-preflight.txt
            learn_v16.py
            learn_data.py
            relational_objective.py
            test_learn_v16.py
            LEARN_V16_PROTOCOL.md
            bridge_v15.py
            measure_v14.py
            contrast_v7.py
            handoff_v5.py
            reconstruct_v1.py
            evidence_v4.py
            jevbench_public_v1.py
            reconstruction-inputs/benchmark/vendor/
          retention-days: 14
          if-no-files-found: error
