name: Resume v6 - live continuation entry point check
on:
  push:
    branches: ['research/resume-v6-20260921']
    paths: ['.github/workflows/resume-v6-extended-check.yml']
permissions:
  contents: read
  actions: read
jobs:
  extended_check:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 35645701540
          name: resume-v6-prepared
      - name: Install unchanged runtime
        run: |
          test "$GITHUB_REPOSITORY" = 'Jaksenc/parameter-golf'
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6'
      - name: Check actual continuation branch on a runtime coverage fixture
        run: |
          python -u - <<'PY'
          from pathlib import Path
          import resume_v6 as r
          from reconstruct_v1 import Runtime
          from decide_resume import decide
          rt=Runtime(Path('reconstruction-inputs'))
          row=r.fresh_tasks()[25]
          assert row['id']=='resume-6230927-schedule-09'
          result=decide(rt,r.h5.input_only(row))
          assert result['extended']
          r.h5.write('live-extended-check.json',{'cases':[result],'selection':'Post-inference control-flow coverage selection from first completed shard because the base draft was incomplete; not a performance benchmark or parameter selection. Main policy unchanged.','entry_point_sha256':r.h5.filehash('decide_resume.py')})
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resume-v6-live-extended-check
          path: live-extended-check.json
          retention-days: 14
          if-no-files-found: error
