name: Probability v13 - native anchor diagnosis
on:
  push:
    branches: ['research/probability-v13-20260922']
    paths: ['.github/workflows/probability-v13-anchor-diagnostic.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 35776811846
          name: probability-v13-prepared
      - name: Install identical main-run dependencies
        run: |
          test "$GITHUB_REPOSITORY" = 'Jaksenc/parameter-golf'
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6'
      - name: Retain repeated anchor observations before interpreting mismatch
        run: |
          python -u - <<'PY'
          import json,subprocess
          from pathlib import Path
          from reconstruct_v1 import Runtime
          import probability_v13 as p
          rt=Runtime(Path('reconstruction-inputs'));fixture=rt.check()
          anchors=json.load(open('probability-prepared/anchors.json'))
          a=anchors[19]
          observations=[]
          for k in range(3):
              obs,_=rt.score(a['input']);observations.append(obs)
              if k==0:rt.score(anchors[0]['input'])
          report={'anchor_id':a['input']['id'],'input':a['input'],'reference':a['native'],
                  'observations':observations,'fixture':fixture,'runtime':rt.receipt,
                  'max_error':[max(abs(x-y) for x,y in zip(o['logits'],a['native']['logits'])) for o in observations],
                  'prompt_match':[o['prompt_hash']==a['native']['prompt_hash'] for o in observations],
                  'repeat_logit_agreement':all(o['logits']==observations[0]['logits'] for o in observations),
                  'scientific_source_sha256':p.filehash('probability_v13.py'),
                  'purpose':'Investigate the stopped shard; no tolerance or primary-policy change.'}
          p.write('anchor-diagnostic.json',report)
          print(json.dumps(report,indent=2))
          PY
          python -m pip freeze > dependencies.txt
          lscpu > cpu.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: probability-v13-anchor-diagnostic
          path: |
            anchor-diagnostic.json
            dependencies.txt
            cpu.txt
          retention-days: 14
          if-no-files-found: error
