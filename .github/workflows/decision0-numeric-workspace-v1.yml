name: Decision-0 bounded numeric workspace
on:
  push:
    branches: ['decision0/verified-cpu4b-20260921']
    paths: ['.github/workflows/decision0-numeric-workspace-v1.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: decision0-numeric-workspace-v1
  cancel-in-progress: false
defaults:
  run:
    shell: bash
    working-directory: decision0/primitive_ladder_v1
env:
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
jobs:
  workspace:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 5d783dac374a041771334b36b36b17a7b94a2668
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Require tested source and exact reference data
        run: |
          test "$(git hash-object numeric_workspace.py)" = 8615b0d000ef18525c34333701baa431beaaed0f
          test "$(git hash-object primitive_ladder.py)" = 450493ffced25421787712c9337e72f396d4210f
          python -m py_compile numeric_workspace.py
          python primitive_ladder.py check
      - name: Install pinned runtime
        run: |
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6' 'numpy==2.4.6' 'safetensors==0.8.0'
      - name: Generate only short numeric estimates and evaluate matched controls
        run: python -u numeric_workspace.py run --shard '${{ matrix.shard }}' --out result
      - name: Preserve exact source and runtime
        if: always()
        run: |
          mkdir -p result
          cp numeric_workspace.py primitive_ladder.py result/
          python -m pip freeze > result/dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nw1-shard-${{ matrix.shard }}
          path: decision0/primitive_ladder_v1/result/
          retention-days: 1
          if-no-files-found: error
  report:
    needs: workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 5d783dac374a041771334b36b36b17a7b94a2668
      - name: Require complete data and report every predefined variant
        run: |
          gh run download "$GITHUB_RUN_ID" -p 'nw1-shard-*' -D inputs
          python3 numeric_workspace.py aggregate --root inputs --out final
          cp numeric_workspace.py primitive_ladder.py final/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nw1-final
          path: decision0/primitive_ladder_v1/final/
          retention-days: 3
          if-no-files-found: error
