name: Decision-0 compact process teacher
on:
  push:
    branches: ['decision0/verified-cpu4b-20260921']
    paths: ['.github/workflows/decision0-process-teacher-v1.yml']
permissions:
  contents: read
concurrency:
  group: decision0-process-teacher-v1
  cancel-in-progress: false
jobs:
  teacher:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 0c0552e3d7a2c9c7c417e45c8dda6d35438f6c1b
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check exact code and source references
        run: |
          test "$(git hash-object decision0/primitive_ladder_v1/process_teacher.py)" = 453a8e8b9cc14f55617425dcb43c1e301957af87
          python decision0/primitive_ladder_v1/primitive_ladder.py check
      - name: Install matching CPU runtime
        run: |
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6' 'numpy==2.4.6' 'safetensors==0.8.0'
      - name: Three bounded generated calculations, no optimizer or answer selection
        timeout-minutes: 12
        run: python -u decision0/primitive_ladder_v1/process_teacher.py --shard '${{ matrix.shard }}' --out result
      - name: Preserve failures and exact source
        if: always()
        run: |
          mkdir -p result
          cp decision0/primitive_ladder_v1/process_teacher.py result/
          python -m pip freeze > result/dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pt1-${{ matrix.shard }}
          path: result/
          retention-days: 3
          if-no-files-found: error
