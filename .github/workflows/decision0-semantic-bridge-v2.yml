name: Decision-0 semantic bridge v2
on:
  push:
    branches: ['decision0/verified-cpu4b-20260921']
    paths: ['.github/workflows/decision0-semantic-bridge-v2.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: decision0-semantic-bridge-v2
  cancel-in-progress: false
defaults:
  run:
    shell: bash
    working-directory: decision0/semantic_bridge_v2
env:
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
jobs:
  score:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: e93914d81260988ff8dc50f4094e57853f174d50
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check fixed data and target isolation before model calls
        run: python semantic_bridge_v2.py selftest
      - name: Install existing verified CPU runtime
        run: |
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6' 'numpy==2.4.6' 'safetensors==0.8.0'
      - name: Actual full-model inference for all six fixed layouts
        timeout-minutes: 24
        run: python -u semantic_bridge_v2.py run --shard '${{ matrix.shard }}' --out scored
      - name: Preserve source and environment
        if: always()
        run: |
          mkdir -p scored/source
          cp semantic_bridge_v2.py scored/source/
          cp ../input_flow_v1/flow_study.py scored/source/
          python -m pip freeze > scored/dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sb2-shard-${{ matrix.shard }}
          path: decision0/semantic_bridge_v2/scored/
          retention-days: 1
          if-no-files-found: error
  report:
    needs: score
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: e93914d81260988ff8dc50f4094e57853f174d50
      - name: Require full coverage without selecting a winner
        run: |
          gh run download "$GITHUB_RUN_ID" -p 'sb2-shard-*' -D shards
          python3 semantic_bridge_v2.py aggregate --root shards --out final
          cp semantic_bridge_v2.py final/
          cp -R shards final/shards
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sb2-final
          path: decision0/semantic_bridge_v2/final/
          retention-days: 3
          if-no-files-found: error
