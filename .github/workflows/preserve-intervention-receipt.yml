name: Preserve verified public intervention evidence
on:
  push:
    branches: ['research/free-decision-baselines-20260920']
    paths: ['.github/workflows/preserve-intervention-receipt.yml']
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Preserve verified numeric public evidence; no inference or datasets
        run: |
          python -m pip install --no-cache-dir 'requests==2.34.2'
          python -u - <<'PY'
          import base64,hashlib,json,os,struct,zlib,requests
          repo='Jaksenc/parameter-golf';branch='research/free-decision-baselines-20260920'
          assert os.environ['GITHUB_REPOSITORY']==repo
          api='https://api.github.com/repos/'+repo
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          meta=requests.get(api+'/actions/jobs/106118068775',headers=headers,timeout=60)
          meta.raise_for_status();assert meta.json()['conclusion']=='success'
          r=requests.get(api+'/actions/jobs/106118068775/logs?archive=1',headers=headers,timeout=60)
          r.raise_for_status();text=r.content.decode('utf-8-sig');found={}
          for line in text.splitlines():
              p=line.find('{')
              if p<0:continue
              try:v=json.loads(line[p:])
              except json.JSONDecodeError:continue
              if isinstance(v,dict) and v.get('kind') in ('intervention_result','portable_logits'):
                  assert v['kind'] not in found
                  found[v['kind']]=v
          assert set(found)=={'intervention_result','portable_logits'}
          result=found['intervention_result'];payload=found['portable_logits']
          assert result['run']==35525372043 and result['verified_calls']==768
          assert result['data_hash']=='6d07e2a9ce2fe2c3287d03d5b7e1ef9d46afed1272db20d622df843f88432a8e'
          raw=zlib.decompress(base64.b64decode(payload['payload'],validate=True))
          assert len(raw)==128*6*3*4 and payload['shape']==[128,6,3]
          assert hashlib.sha256(raw).hexdigest()==payload['sha256']=='550557a8be9d8e97364b95cbb180044749d16e0dea36bbf8cf84e05bb41fc5e7'
          vals=struct.unpack('<2304f',raw)
          numeric={'sha256_of_float32':payload['sha256'],'row_metadata':payload['row_metadata'],'logits':[[list(vals[(i*6+j)*3:(i*6+j+1)*3]) for j in range(6)] for i in range(128)],'source_audit_job':106118068775,'source_run':35525372043}
          files={'results.json':result,'scores.json':numeric}
          for name,value in files.items():
              body=json.dumps(value,sort_keys=True,indent=2,allow_nan=False).encode()
              assert len(body)<200000
              path='evidence/intervention-v1/'+name
              response=requests.put(api+'/contents/'+path,headers=headers,json={'message':'Preserve completed public intervention '+name,'content':base64.b64encode(body).decode(),'branch':branch},timeout=60)
              response.raise_for_status()
              print(json.dumps({'path':path,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest(),'commit':response.json()['commit']['sha']},sort_keys=True),flush=True)
          print('Completed public numeric evidence only; no raw text, private files, model weights, artifact storage, or new inference.')
          PY
