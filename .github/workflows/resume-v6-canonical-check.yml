name: Resume v6 - canonical interface replay
on:
  push:
    branches: ['research/resume-v6-20260921']
    paths: ['.github/workflows/resume-v6-canonical-check.yml']
permissions:
  contents: read
  actions: read
jobs:
  canonical_check:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 35645701540
          name: resume-v6-prepared
      - name: Install unchanged runtime
        run: |
          test "$GITHUB_REPOSITORY" = 'Jaksenc/parameter-golf'
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6'
      - name: Replay same three interface fixtures with benchmark-equivalent serialization
        run: |
          python -u - <<'PY'
          import json
          from pathlib import Path
          import resume_v6 as r
          from reconstruct_v1 import Runtime
          from decide_canonical import decide,canonical_payload
          import evidence_v4 as e4
          rt=Runtime(Path('reconstruction-inputs'))
          planned={x['input']['id']:x['input'] for group in json.load(open('resume-prepared/jobs.json')) for x in group}
          rows=r.fresh_tasks();results=[]
          for i in (0,48,25):
              payload=r.h5.input_only(rows[i]);fixed=canonical_payload(payload)
              assert e4.messages(fixed,'reason')==e4.messages(planned[payload['id']],'reason')
              results.append(decide(rt,payload))
          r.h5.write('canonical-interface-check.json',{'cases':results,'selection':'Same two predeclared fixtures plus continuation-coverage fixture. Post-static-audit interface serialization correction only; main inference, protocol and outcomes unchanged. Not a performance benchmark.','entry_point_sha256':r.h5.filehash('decide_canonical.py'),'base_entry_point_sha256':r.h5.filehash('decide_resume.py')})
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resume-v6-canonical-interface
          path: |
            canonical-interface-check.json
            decide_canonical.py
          retention-days: 14
          if-no-files-found: error
