name: Decision-0 broader workspace transfer v1
on:
  push:
    branches: ['decision0/verified-cpu4b-20260921']
    paths: ['.github/workflows/decision0-workspace-transfer-v1.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: decision0-workspace-transfer-v1
  cancel-in-progress: false
defaults:
  run:
    shell: bash
    working-directory: decision0/workspace_transfer_v1
env:
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
jobs:
  transfer:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: e2f086032356f47b0456c92356cdcbb53c394c80
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Require exact locally checked source and independent references
        run: |
          test "$(git hash-object transfer.py)" = 5f77873d68c64aa5cbb8d61d55ffb3256ea0a5cf
          test "$(git hash-object ../input_flow_v1/flow_study.py)" = 35d9e8a127b86f43040d11b6d5bd14c679ebe143
          test "$(git hash-object ../input_flow_v1/prompt_variants.py)" = a954591520b15569c28f4d5d48f1ed0c3c9bf7c7
          python transfer.py selftest
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==5.17.0' 'huggingface-hub==1.32.0' 'sentencepiece==0.2.2' 'protobuf==6.33.6' 'numpy==2.4.6' 'safetensors==0.8.0'
      - name: Full-model matched inference on new paired transfer cases
        timeout-minutes: 30
        run: python -u transfer.py run --phase dev --shard '${{ matrix.shard }}' --nshards 8 --out result
      - name: Preserve checked source and runtime
        if: always()
        run: |
          mkdir -p result/source
          cp transfer.py ../input_flow_v1/flow_study.py ../input_flow_v1/prompt_variants.py ../input_flow_v1/flow_data.py ../input_flow_v1/THIRD_PARTY_NOTICES.md result/source/
          python -m pip freeze > result/dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wst1-shard-${{ matrix.shard }}
          path: decision0/workspace_transfer_v1/result/
          retention-days: 1
          if-no-files-found: error
  report:
    needs: transfer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: e2f086032356f47b0456c92356cdcbb53c394c80
      - name: Audit full coverage and freeze off-benchmark decision
        run: |
          gh run download "$GITHUB_RUN_ID" -p 'wst1-shard-*' -D shards
          python3 transfer.py aggregate --phase dev --root shards --out final
          cp transfer.py final/
          cp -R shards final/shards
          cp -R ../input_flow_v1 final/parent_source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wst1-final
          path: decision0/workspace_transfer_v1/final/
          retention-days: 3
          if-no-files-found: error
