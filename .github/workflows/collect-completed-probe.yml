name: Collect completed decision checkpoints
on:
  push:
    branches: ['research/free-decision-baselines-20260920']
    paths: ['collect_completed_probe.py', '.github/workflows/collect-completed-probe.yml']
permissions:
  contents: read
  actions: read
jobs:
  collect:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install public data readers
        run: python -m pip install --no-cache-dir 'datasets==4.8.5' 'huggingface-hub==1.32.0'
      - name: Verify completed models and export native score payloads
        run: |
          python -u - <<'PY'
          import os,requests,time
          import collect_completed_probe as collector
          def safe_api(path,text=False):
              url='https://api.github.com/repos/Jaksenc/parameter-golf'+path
              if text:url+='?audit='+str(time.time_ns())
              r=requests.get(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},timeout=90,allow_redirects=True)
              r.raise_for_status()
              return r.content.decode('utf-8-sig') if text else r.json()
          collector.api=safe_api
          collector.main()
          PY
